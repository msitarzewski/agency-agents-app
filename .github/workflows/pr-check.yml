# PR check — runs on every pull request and every push to main.
#
# For now it checks Rust formatting only: `cargo fmt --check` over src-tauri.
# rustfmt reads source files alone, so this job needs no system libraries and
# no dependency build, and it finishes in seconds. svelte-check and
# `cargo test` (memory-bank/decisions.md 2026-09-14) belong here as further
# jobs; they need the Tauri Linux libraries, so they're a separate step.
#
# Formatting is rustfmt's defaults (no rustfmt.toml), edition 2021. A PR that
# fails here needs `cargo fmt --manifest-path src-tauri/Cargo.toml`.

name: PR Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    name: Rust formatting (cargo fmt --check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable (+ rustfmt)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
