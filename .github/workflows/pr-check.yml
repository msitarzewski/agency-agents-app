# PR check — runs on every pull request and every push to main.
#
# Four gates run here:
#   - `cargo fmt --check` over src-tauri (rustfmt reads source files alone).
#   - `tools/phase-c/validate-config.mjs`, which rejects the macOS-only
#     `macos-private-api` feature leaking into the base `tauri` dependency —
#     the Tauri CLI injects it there on every macOS build, and shipping that
#     form breaks the Linux/Windows feature allowlist. This is the CI
#     enforcement of that guard, so it cannot land by accident.
#   - `svelte-check` (npm run check) over the frontend.
#   - `cargo test` over the backend (memory-bank/decisions.md 2026-09-14).
#     It needs the Tauri Linux libraries, so it installs them like
#     linux-build.yml does and runs on the same ubuntu-22.04 floor.
#
# Formatting is rustfmt's defaults (no rustfmt.toml), edition 2021. A PR that
# fails here needs `cargo fmt --manifest-path src-tauri/Cargo.toml`.

name: PR Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    name: Rust formatting (cargo fmt --check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable (+ rustfmt)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  config:
    name: Phase C config validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate config
        run: node tools/phase-c/validate-config.mjs

  frontend:
    name: Svelte check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check

  backend:
    name: Rust tests
    # Same oldest-glibc floor as the release build, so a test that depends on
    # a newer system library fails here before it reaches a tag.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
