# PR check — runs on every pull request and every push to main.
#
# Three gates run here:
#   - `cargo fmt --check` over src-tauri (rustfmt reads source files alone).
#   - `tools/phase-c/validate-config.mjs`, which rejects the macOS-only
#     `macos-private-api` feature leaking into the base `tauri` dependency —
#     the Tauri CLI injects it there on every macOS build, and shipping that
#     form breaks the Linux/Windows feature allowlist. This is the CI
#     enforcement of that guard, so it cannot land by accident.
#   - `svelte-check` (npm run check) over the frontend.
# `cargo test` (memory-bank/decisions.md 2026-09-14) belongs here too; it
# needs the Tauri Linux libraries, so it's a separate step.
#
# Formatting is rustfmt's defaults (no rustfmt.toml), edition 2021. A PR that
# fails here needs `cargo fmt --manifest-path src-tauri/Cargo.toml`.

name: PR Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    name: Rust formatting (cargo fmt --check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable (+ rustfmt)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  config:
    name: Phase C config validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate config
        run: node tools/phase-c/validate-config.mjs

  frontend:
    name: Svelte check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check
